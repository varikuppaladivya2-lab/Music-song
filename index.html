<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Music Player</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <div class="player">
      <!-- Album Art -->
      <div class="album-art">
        <img id="album-img" src="https://picsum.photos/seed/song1/300/300" alt="Album Art" />
      </div>

      <!-- Song Info -->
      <div class="song-info">
        <h2 id="song-title">Song Title</h2>
        <p id="song-artist">Artist Name</p>
      </div>

      <!-- Progress Bar -->
      <div class="progress-container">
        <span id="current-time">0:00</span>
        <input type="range" id="progress-bar" value="0" min="0" max="100" step="0.1" />
        <span id="duration">0:00</span>
      </div>

      <!-- Controls -->
      <div class="controls">
        <button id="btn-prev" title="Previous">&#9664;&#9664;</button>
        <button id="btn-play" title="Play/Pause">&#9654;</button>
        <button id="btn-next" title="Next">&#9654;&#9654;</button>
      </div>

      <!-- Volume & Autoplay -->
      <div class="extras">
        <div class="volume-control">
          <span>&#128266;</span>
          <input type="range" id="volume-bar" value="80" min="0" max="100" />
        </div>
        <label class="autoplay-toggle">
          <input type="checkbox" id="autoplay-check" checked />
          Autoplay
        </label>
      </div>
    </div>

    <!-- Playlist -->
    <div class="playlist">
      <h3>Playlist</h3>
      <ul id="playlist"></ul>
    </div>
  </div>

  <audio id="audio"></audio>
  <script src="app.js"></script>
</body>
</html>
